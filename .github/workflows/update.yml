name: Update MLB Digest

on:
  schedule:
    # 毎日、日本時間の 10:00（UTC 01:00）と 15:00（UTC 06:00）に自動実行
    - cron: '0 1,6 * * *'
  workflow_dispatch: # これがあると手動でもいつでも実行できます

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser requests trafilatura google-genai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html articles.json
          git commit -m "Auto-update MLB digest" || exit 0
          git push
